[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fractal-governance-architecture"
version = "0.1.0"
description = "T18 — machine-verifiable governance via content-addressed Merkle-chained artifacts"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["governance", "merkle-chain", "verification", "smt", "tamper-evident"]

[tool.setuptools.packages.find]
where = ["src"]
